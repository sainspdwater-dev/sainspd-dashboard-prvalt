<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Dashboard PRV & Alt – Port Dickson</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        }

        body {
            background: #020b12;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* ==========================================
           LATAR BELAKANG SINEMATIK PAIP AIR (CANVAS)
           ========================================== */
        #pipelineCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.8;
            transition: opacity 0.5s;
        }

        .dark-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: 
                radial-gradient(ellipse at 65% 40%, rgba(0, 20, 40, 0.4) 0%, rgba(0, 5, 10, 0.6) 70%),
                linear-gradient(180deg, rgba(0, 15, 30, 0.5) 0%, rgba(0, 5, 12, 0.7) 100%);
            mix-blend-mode: normal;
        }

        .vignette {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.4) 100%);
        }

        /* ==========================================
           KAD LOGIN
           ========================================== */
        .water-auth-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            background: rgba(8, 22, 35, 0.8);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 2.8rem 1.5rem 2.8rem 1.5rem;
            box-shadow: 
                0 30px 60px -15px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(100, 200, 255, 0.15) inset,
                0 0 40px rgba(0, 120, 200, 0.2);
            padding: 2.8rem 2.2rem 2.2rem 2.2rem;
            border: 1px solid rgba(120, 210, 255, 0.2);
            transition: opacity 0.5s ease, transform 0.2s ease, box-shadow 0.3s;
            animation: slideFromRight 0.9s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            will-change: transform, opacity;
        }

        @keyframes slideFromRight {
            0% {
                transform: translateX(120%);
                opacity: 0;
            }
            60% {
                transform: translateX(-5%);
                opacity: 1;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .fade-to-black {
            animation: fadeBlack 1.2s ease forwards !important;
        }

        @keyframes fadeBlack {
            0% {
                opacity: 1;
                filter: brightness(1);
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                filter: brightness(0.8);
                transform: scale(0.99);
            }
            100% {
                opacity: 0;
                filter: brightness(0);
                transform: scale(0.98);
            }
        }

        .vibrate-fail {
            animation: vibrate 0.4s linear 0s 2;
        }

        @keyframes vibrate {
            0% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(4px); }
            100% { transform: translateX(0); }
        }

        .water-icon {
            display: flex;
            justify-content: center;
            margin-bottom: 1.8rem;
        }

        .water-drop-symbol {
            width: 68px;
            height: 68px;
            background: radial-gradient(circle at 35% 30%, #6dd5fa, #0a6e9e);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            transform: rotate(45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 25px -8px rgba(0, 100, 150, 0.6);
            border: 2px solid rgba(200, 240, 255, 0.5);
        }

        .water-drop-symbol i {
            transform: rotate(-45deg);
            font-size: 2rem;
            color: white;
            text-shadow: 0 2px 10px #004466;
            font-style: normal;
            font-weight: bold;
            line-height: 1;
            display: block;
        }

        h2 {
            text-align: center;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #b8e6ff;
            margin-bottom: 0.2rem;
            font-size: 1.7rem;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.4);
        }

        .sub-location {
            text-align: center;
            font-size: 0.95rem;
            font-weight: 500;
            color: #7fc8e8;
            letter-spacing: 3px;
            margin-bottom: 1.8rem;
            text-transform: uppercase;
            opacity: 0.85;
            border-bottom: 1px solid rgba(100, 180, 220, 0.3);
            padding-bottom: 0.8rem;
        }

        .input-group {
            margin-bottom: 1.6rem;
            position: relative;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #9ac9e0;
            letter-spacing: 0.3px;
            font-size: 0.9rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.85rem 3rem 0.85rem 1.2rem;
            border: 2px solid rgba(100, 180, 220, 0.4);
            border-radius: 30px;
            background: rgba(0, 20, 35, 0.7);
            backdrop-filter: blur(4px);
            font-size: 1rem;
            outline: none;
            transition: all 0.25s;
            color: #e0f0fa;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        input::placeholder {
            color: #6a8fa0;
        }

        input:focus {
            border-color: #4db8e8;
            background: rgba(0, 30, 50, 0.85);
            box-shadow: 0 0 0 4px rgba(77, 184, 232, 0.15);
        }

        .show-password-btn {
            position: absolute;
            right: 14px;
            background: transparent;
            border: none;
            cursor: pointer;
            color: #8ab8cc;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 50%;
            transition: all 0.2s;
            opacity: 0.7;
            width: 32px;
            height: 32px;
        }

        .show-password-btn:hover {
            background: rgba(100, 180, 220, 0.2);
            opacity: 1;
            color: #c8e8ff;
        }

        .show-password-btn svg {
            width: 19px;
            height: 19px;
            fill: none;
            stroke: #aacfe0;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .login-btn {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #0a6e9e, #0b4a6e);
            border: none;
            border-radius: 40px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 25px -5px rgba(0, 80, 130, 0.5);
            margin-top: 0.5rem;
            border: 1px solid rgba(150, 210, 245, 0.3);
            text-transform: uppercase;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #0e86b8, #0d5c82);
            transform: translateY(-2px);
            box-shadow: 0 18px 30px -8px #001a2e;
        }

        .login-btn:active {
            transform: translateY(2px);
            box-shadow: 0 5px 15px #001a2e;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message-area {
            text-align: center;
            margin-top: 1.4rem;
            min-height: 28px;
            font-weight: 500;
            color: #ff9e9e;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .message-area.loading {
            color: #ffcc00;
        }

        .message-area.success {
            color: #7fd4a8;
        }

        .message-area.error {
            color: #ff9e9e;
        }

        .info-bubbles {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 1rem;
            font-size: 0.75rem;
            color: #6a9ab0;
            flex-wrap: wrap;
            letter-spacing: 0.5px;
        }

        @media (max-width: 450px) {
            .water-auth-card {
                padding: 2rem 1.5rem;
                border-radius: 2rem;
            }
            h2 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <canvas id="pipelineCanvas"></canvas>
    <div class="dark-overlay"></div>
    <div class="vignette"></div>

    <div class="water-auth-card" id="authCard">
        <div class="water-icon">
            <div class="water-drop-symbol">
                <i>💧</i>
            </div>
        </div>
        <h2>Dashboard PRV & Alt</h2>
        <div class="sub-location">Port Dickson</div>
        
        <div class="input-group">
            <label for="username">ID Pengguna</label>
            <div class="input-wrapper">
                <input type="text" id="username" placeholder="cth: sainspd" autocomplete="off" value="sainspd">
            </div>
        </div>

        <div class="input-group">
            <label for="password">Kata Laluan</label>
            <div class="input-wrapper">
                <input type="password" id="password" placeholder="••••••••" autocomplete="off" value="sainspd">
                <button class="show-password-btn" id="togglePasswordBtn" type="button" title="Tunjuk/sembunyi kata laluan">
                    <svg id="eyeIcon" viewBox="0 0 24 24">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
        </div>

        <button class="login-btn" id="loginButton">Log Masuk</button>

        <div class="message-area" id="messageBox"></div>
        <div class="info-bubbles">
            <span>💧 Milik SAINSPD</span>
            <span>🔒 Encrypted</span>
        </div>
    </div>

    <script>
        (function() {
            // ============================================
            // CONFIGURATION - Kemaskini di sini sahaja!
            // ============================================
            const CONFIG = {
                // 🔐 SECRET KEY - Dapatkan dari GAS setup() log
                // Jalankan setup() di GAS dan salin key dari log
                SECRET_KEY: 'PRV_ALT_3f7g9h2k4m6n8p1q3r5t7v9x2z4b6c8d',
                
                // 🌐 API URL - Cloudflare Worker URL
                API_URL: 'https://dashboardprvalt.sainspddriver.workers.dev/',
                
                // ⏱️ Retry settings
                MAX_RETRY: 3,
                RETRY_DELAY: 2000,
                
                // ⏱️ Timeout settings
                TIMEOUT: 30000
            };

            // ============================================
            // DOM ELEMENTS
            // ============================================
            const authCard = document.getElementById('authCard');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.getElementById('togglePasswordBtn');
            const loginBtn = document.getElementById('loginButton');
            const messageBox = document.getElementById('messageBox');
            const eyeIcon = document.getElementById('eyeIcon');

            // ============================================
            // TOGGLE PASSWORD VISIBILITY
            // ============================================
            toggleBtn.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type');
                if (type === 'password') {
                    passwordInput.setAttribute('type', 'text');
                    eyeIcon.innerHTML = `
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    `;
                } else {
                    passwordInput.setAttribute('type', 'password');
                    eyeIcon.innerHTML = `
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    `;
                }
            });

            // ============================================
            // UI HELPERS
            // ============================================
            function setMessage(text, type = 'error') {
                messageBox.textContent = text;
                messageBox.className = 'message-area ' + type;
            }

            function triggerVibrate() {
                authCard.classList.remove('fade-to-black', 'vibrate-fail');
                void authCard.offsetWidth;
                authCard.classList.add('vibrate-fail');
                setTimeout(() => {
                    authCard.classList.remove('vibrate-fail');
                }, 500);
            }

            function triggerFadeToBlack() {
                authCard.classList.remove('vibrate-fail');
                void authCard.offsetWidth;
                authCard.classList.add('fade-to-black');
            }

            function setLoading(isLoading) {
                if (isLoading) {
                    loginBtn.disabled = true;
                    loginBtn.innerHTML = '<span class="loading-spinner"></span> MENGESAHKAN...';
                    setMessage('⏳ Sila tunggu...', 'loading');
                } else {
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Log Masuk';
                }
            }

            // ============================================
            // LOGIN FUNCTION WITH RETRY
            // ============================================
            function attemptLogin(username, hashedPassword, retryCount = 0) {
                const payload = {
                    action: 'authenticate',
                    internalSecret: CONFIG.SECRET_KEY,
                    username: username,
                    password: hashedPassword
                };

                console.log('📤 Sending login request...');

                // Create timeout promise
                const timeoutPromise = new Promise((_, reject) => {
                    setTimeout(() => reject(new Error('Request timeout')), CONFIG.TIMEOUT);
                });

                // Create fetch promise
                const fetchPromise = fetch(CONFIG.API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Race between fetch and timeout
                return Promise.race([fetchPromise, timeoutPromise])
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        console.log('📨 Response received:', data);
                        
                        if (data.success) {
                            return { success: true, data: data.data };
                        } else {
                            throw new Error(data.message || 'Authentication failed');
                        }
                    })
                    .catch(error => {
                        console.error('❌ Attempt ' + (retryCount + 1) + ' failed:', error.message);
                        
                        // Retry logic
                        if (retryCount < CONFIG.MAX_RETRY - 1) {
                            const nextRetry = retryCount + 1;
                            setMessage(`⏳ Cubaan ${nextRetry}/${CONFIG.MAX_RETRY}...`, 'loading');
                            console.log(`🔄 Retry ${nextRetry}/${CONFIG.MAX_RETRY} in ${CONFIG.RETRY_DELAY}ms`);
                            
                            return new Promise((resolve) => {
                                setTimeout(() => {
                                    resolve(attemptLogin(username, hashedPassword, nextRetry));
                                }, CONFIG.RETRY_DELAY);
                            });
                        }
                        
                        // Max retries reached
                        throw error;
                    });
            }

            // ============================================
            // LOGIN BUTTON CLICK HANDLER
            // ============================================
            loginBtn.addEventListener('click', function(e) {
                e.preventDefault();
                
                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();
                
                // Reset message
                setMessage('');
                
                // Validate input
                if (username === '' || password === '') {
                    setMessage('⚠️ Sila isi ID dan kata laluan.', 'error');
                    triggerVibrate();
                    return;
                }

                // Show loading state
                setLoading(true);

                // Hash password
                const hashedPassword = CryptoJS.SHA256(password).toString(CryptoJS.enc.Hex);
                console.log('🔐 Password hashed');

                // Attempt login with retry
                attemptLogin(username, hashedPassword)
                    .then(result => {
                        setLoading(false);
                        
                        if (result.success) {
                            setMessage('✅ Log masuk berjaya! Memuatkan...', 'success');
                            
                            // Save session
                            localStorage.setItem('AUTH_TOKEN', result.data.token);
                            localStorage.setItem('USER_ROLE', result.data.role);
                            localStorage.setItem('USERNAME', result.data.username);
                            localStorage.setItem('LOGIN_TIMESTAMP', new Date().getTime());
                            
                            console.log('✅ Login successful for:', result.data.username);
                            
                            // Fade and redirect
                            triggerFadeToBlack();
                            setTimeout(() => {
                                window.location.href = "index.html";
                            }, 1200);
                        }
                    })
                    .catch(error => {
                        setLoading(false);
                        console.error('❌ Login failed:', error.message);
                        setMessage('❌ ' + error.message, 'error');
                        triggerVibrate();
                    });
            });

            // ============================================
            // ENTER KEY SUPPORT
            // ============================================
            [usernameInput, passwordInput].forEach(input => {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        loginBtn.click();
                    }
                });
            });

            // ============================================
            // CANVAS PIPELINE ANIMATION
            // ============================================
            const canvas = document.getElementById('pipelineCanvas');
            const ctx = canvas.getContext('2d');
            let W, H;
            let pipes = [];
            let bubbles = [];

            function resizeCanvas() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function createPipe(x1, y1, x2, y2, radius) {
                return { x1, y1, x2, y2, radius, flowOffset: Math.random() * 100, flowSpeed: Math.random() * 1.5 + 0.8 };
            }

            function initPipes() {
                pipes = [];
                pipes.push(createPipe(-50, H * 0.2, W * 0.4, H * 0.2, 35));
                pipes.push(createPipe(W * 0.4, H * 0.2, W * 0.4, H * 0.8, 30));
                pipes.push(createPipe(W * 0.4, H * 0.8, W + 50, H * 0.8, 28));
                pipes.push(createPipe(W * 0.7, -50, W * 0.7, H + 50, 22));
            }
            initPipes();

            for (let i = 0; i < 40; i++) {
                bubbles.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: Math.random() * 4 + 1,
                    speed: Math.random() * 0.8 + 0.4,
                    alpha: Math.random() * 0.5 + 0.1
                });
            }

            function animate() {
                ctx.clearRect(0, 0, W, H);
                ctx.fillStyle = '#020b12';
                ctx.fillRect(0, 0, W, H);

                pipes.forEach(p => {
                    ctx.beginPath();
                    ctx.moveTo(p.x1, p.y1);
                    ctx.lineTo(p.x2, p.y2);
                    ctx.lineWidth = p.radius * 2 + 6;
                    ctx.strokeStyle = 'rgba(0, 40, 70, 0.5)';
                    ctx.lineCap = 'round';
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(p.x1, p.y1);
                    ctx.lineTo(p.x2, p.y2);
                    ctx.lineWidth = p.radius * 2;
                    ctx.strokeStyle = 'rgba(0, 15, 25, 0.9)';
                    ctx.stroke();

                    p.flowOffset += p.flowSpeed;
                    ctx.beginPath();
                    ctx.moveTo(p.x1, p.y1);
                    ctx.lineTo(p.x2, p.y2);
                    ctx.lineWidth = p.radius * 1.2;
                    let grad = ctx.createLinearGradient(p.x1, p.y1, p.x2, p.y2);
                    grad.addColorStop(0, 'rgba(0, 150, 220, 0.1)');
                    grad.addColorStop(0.5, 'rgba(100, 215, 255, 0.4)');
                    grad.addColorStop(1, 'rgba(0, 150, 220, 0.1)');
                    ctx.strokeStyle = grad;
                    ctx.setLineDash([20, 15]);
                    ctx.lineDashOffset = -p.flowOffset;
                    ctx.stroke();
                    ctx.setLineDash([]);
                });

                bubbles.forEach(b => {
                    b.y -= b.speed;
                    if (b.y < -10) b.y = H + 10;
                    ctx.fillStyle = `rgba(150, 215, 255, ${b.alpha})`;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                    ctx.fill();
                });

                requestAnimationFrame(animate);
            }
            animate();

            // ============================================
            // ADD LOADING SPINNER STYLE
            // ============================================
            const style = document.createElement('style');
            style.textContent = `
                .loading-spinner {
                    width: 18px;
                    height: 18px;
                    border: 2px solid rgba(255,255,255,0.3);
                    border-top-color: #fff;
                    border-radius: 50%;
                    animation: spin 0.8s linear infinite;
                    display: inline-block;
                    margin-right: 8px;
                    vertical-align: middle;
                }
                @keyframes spin {
                    to { transform: rotate(360deg); }
                }
            `;
            document.head.appendChild(style);

            // ============================================
            // LOG CONFIG (FOR DEBUGGING - Remove in production)
            // ============================================
            console.log('🔐 Login Page Loaded');
            console.log('📡 API URL:', CONFIG.API_URL);
            console.log('🔑 Secret Key:', CONFIG.SECRET_KEY ? '***SET***' : '❌ MISSING!');
            console.log('🔄 Max Retry:', CONFIG.MAX_RETRY);

        })();
    </script>
</body>
</html>
